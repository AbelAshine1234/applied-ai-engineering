services:
  applied-ai-docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applied-ai-engineering-docs
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', (r) => {if (r.statusCode !== 200) process.exit(1);});\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
